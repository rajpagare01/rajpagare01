name: Generate Snake Animation & Activity Graph

on:
  schedule:
    - cron: "0 0 * * *" # Runs automatically every 24 hours at midnight
  workflow_dispatch:    # Lets you trigger it manually with 1 click
  push:
    branches:
      - main
      - master

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Generate looping activity graph SVG
        run: |
          python -c "
          import urllib.request, os
          url = 'https://activity-graph.vercel.app/graph?username=${{ github.repository_owner }}&bg_color=0d1117&color=36bcf7&line=36bcf7&point=ffffff&area=true&hide_border=true'
          req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
          svg = urllib.request.urlopen(req).read().decode('utf-8')
          svg = svg.replace('animation: dash 5s ease-in-out forwards;', 'animation: dash 6s ease-in-out infinite;')
          svg = svg.replace('animation: blink 1s ease-in-out forwards;', 'animation: blink 6s ease-in-out infinite;')
          old_kf = '''        @keyframes blink {
                      from {
                          opacity: 0;
                          transform:translateX(-20px); 
                      }
                      to {
                          opacity:1;
                          transform: translateX(0);
                      }
                  }
              
                          
                  @keyframes dash {
                      to {
                          stroke-dashoffset: 0;
                      }
                  }'''
          new_kf = '''        @keyframes blink {
                      0%, 40% { opacity: 0; transform: scale(0.3); }
                      55%, 85% { opacity: 1; transform: scale(1); }
                      95%, 100% { opacity: 0; transform: scale(0.3); }
                  }
                  @keyframes dash {
                      0% { stroke-dashoffset: 5000; opacity: 0.2; }
                      10% { opacity: 1; }
                      55% { stroke-dashoffset: 0; opacity: 1; }
                      85% { stroke-dashoffset: 0; opacity: 1; }
                      100% { stroke-dashoffset: 5000; opacity: 0.2; }
                  }'''
          if old_kf in svg:
              svg = svg.replace(old_kf, new_kf)
          os.makedirs('dist', exist_ok=True)
          with open('dist/activity-graph.svg', 'w', encoding='utf-8') as f:
              f.write(svg)
          "

      - name: Push artifacts to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
